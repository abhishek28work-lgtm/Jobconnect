<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Job - JobConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'employer_dashboard' %}">

            JobConnect

        </a>

        <a
            href="{% url 'employer_dashboard' %}"
            class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>


<!-- MAIN CONTENT -->

<div class="container mt-5">


    <div class="card shadow-sm">


        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Edit Job
            </h3>

        </div>


        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                {{ form.as_p }}


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Save Changes

                    </button>


                    <a
                        href="{% url 'employer_dashboard' %}"
                        class="btn btn-secondary ms-2">

                        Cancel

                    </a>

                </div>


            </form>


        </div>

    </div>


</div>


</body>

</html>
