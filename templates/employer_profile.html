<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Profile - JobConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'employer_dashboard' %}"
        >
            JobConnect
        </a>


        <div>

            <a
                href="{% url 'employer_dashboard' %}"
                class="btn btn-light me-2"
            >
                Dashboard
            </a>


            <a
                href="{% url 'logout' %}"
                class="btn btn-light"
            >
                Logout
            </a>

        </div>

    </div>

</nav>



<!-- =========================
     PROFILE
========================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <h1 class="mb-2">
                        Company Profile
                    </h1>


                    <p class="text-muted mb-4">

                        Update your company information.

                    </p>



                    <!-- SUCCESS MESSAGE -->

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-success">

                                {{ message }}

                            </div>

                        {% endfor %}

                    {% endif %}



                    <form
                        method="POST"
                    >

                        {% csrf_token %}



                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>


                            <input
                                type="text"
                                class="form-control"
                                value="{{ request.user.username }}"
                                disabled
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>


                            <input
                                type="email"
                                class="form-control"
                                value="{{ request.user.email }}"
                                disabled
                            >

                        </div>



                        <!-- COMPANY NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Company Name
                            </label>


                            <input
                                type="text"
                                name="company_name"
                                class="form-control"
                                value="{{ profile.company_name }}"
                                placeholder="Enter company name"
                                required
                            >

                        </div>



                        <!-- DESCRIPTION -->

                        <div class="mb-3">

                            <label class="form-label">
                                Company Description
                            </label>


                            <textarea
                                name="company_description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your company"
                                required
                            >{{ profile.company_description }}</textarea>

                        </div>



                        <!-- LOCATION -->

                        <div class="mb-4">

                            <label class="form-label">
                                Company Location
                            </label>


                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                value="{{ profile.location }}"
                                placeholder="Example: Bengaluru, Karnataka"
                                required
                            >

                        </div>



                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Company Profile
                        </button>


                        <a
                            href="{% url 'employer_dashboard' %}"
                            class="btn btn-secondary ms-2"
                        >
                            Cancel
                        </a>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
